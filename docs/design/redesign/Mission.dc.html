<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spriite · Build detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5CE57D}a:hover{color:#8BF0A2}
input::placeholder{color:#7F9785}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; background: #07110A; color: #EAF5EC; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 14px 18px 20px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EAF5EC; margin-left: -10px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <button type="button" aria-label="More actions" style="width: 44px; height: 44px; border: 0; background: transparent; color: #EAF5EC; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
      </button>
    </div>

    <div style="display: flex; gap: 14px; align-items: center">
      <div style="width: 72px; height: 72px; flex: 0 0 72px; border-radius: 18px; background: #000000; display: flex; align-items: center; justify-content: center">
        <dc-import name="Sprite" pose="delegating" px="2" hint-size="64px,64px"></dc-import>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: -0.02em">Checkout flow</h1>
        <span style="font-size: 14px; color: #9AB1A0">your-org/shop-site · on studio</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 0">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; gap: 14px">
          <div style="display: flex; flex-direction: column; align-items: center; width: 24px; flex: 0 0 24px">
            <span style="width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box; border: 2px solid {{s.ring}}; background: {{s.fill}}; color: #04210E; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{s.mark}}</span>
            <span style="width: 2px; flex: 1; min-height: 18px; background: {{s.line}}"></span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 3px; padding-bottom: 16px; flex: 1">
            <span style="font-size: 15px; font-weight: 600; color: {{s.titleColor}}">{{s.title}}</span>
            <span style="font-size: 13px; color: #9AB1A0; line-height: 1.4">{{s.detail}}</span>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9AB1A0">Who’s working</h2>
      <div style="background: #0D1A11; border: 1px solid #1F3326; border-radius: 16px; display: flex; flex-direction: column">
        <sc-for list="{{agents}}" as="a" hint-placeholder-count="4">
          <div style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-top: {{a.border}}">
            <span style="width: 34px; height: 34px; flex: 0 0 34px; border-radius: 10px; background: #13241A; color: {{a.tint}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{a.mono}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 14px; font-weight: 600">{{a.name}}</span>
              <span style="font-size: 13px; color: #9AB1A0; line-height: 1.35">{{a.doing}}</span>
            </span>
            <span style="font-size: 12px; font-weight: 600; color: {{a.tint}}">{{a.state}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9AB1A0">Latest</h2>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="align-self: flex-start; max-width: 300px; background: #13241A; border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 14px; line-height: 1.45">
          <span style="display: block; font-size: 12px; font-weight: 600; color: #5CE57D; margin-bottom: 2px">Lead · 2 min ago</span>
          Cart totals are in and 6 checks pass. Starting the payment step next.
        </div>
        <div style="align-self: flex-end; max-width: 280px; background: #5CE57D; color: #04210E; border-radius: 14px 14px 4px 14px; padding: 10px 12px; font-size: 14px; line-height: 1.45">
          Use Stripe test mode for now.
        </div>
      </div>
    </div>
  </div>

  <div style="border-top: 1px solid #1F3326; background: #0A150D; padding: 12px 14px 18px; display: flex; gap: 8px; align-items: center">
    <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message the Lead</label>
    <input id="msg" placeholder="Message the Lead…" style="flex: 1; min-width: 0; min-height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 23px; border: 1px solid #24452F; background: #07110A; color: #EAF5EC; font: 16px 'Instrument Sans', sans-serif">
    <button type="button" aria-label="Talk" style="width: 46px; height: 46px; border-radius: 23px; border: 1px solid #24452F; background: transparent; color: #EAF5EC; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
    </button>
    <button type="button" aria-label="Pause build" style="width: 46px; height: 46px; border-radius: 23px; border: 0; background: #13241A; color: #EAF5EC; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const done = { ring: '#5CE57D', fill: '#5CE57D', mark: '✓', line: '#5CE57D', titleColor: '#EAF5EC' };
    const now = { ring: '#5CE57D', fill: '#07110A', mark: '', line: '#1F3326', titleColor: '#5CE57D' };
    const next = { ring: '#2E4A37', fill: '#07110A', mark: '', line: '#1F3326', titleColor: '#9AB1A0' };
    const steps = [
      { ...done, title: 'Plan agreed', detail: '4 milestones · you approved at 2:10' },
      { ...done, title: 'Cart and totals', detail: '6 checks passed' },
      { ...now, title: 'Payment step', detail: 'Building now · 2 workers' },
      { ...next, title: 'Order emails and pull request', detail: 'Asks you before opening the pull request', line: 'transparent' }
    ];
    const agents = [
      { mono: 'L', name: 'Lead', doing: 'Splitting the payment work', state: 'Planning', tint: '#5CE57D' },
      { mono: 'W1', name: 'Worker · API', doing: 'Stripe checkout session route', state: 'Coding', tint: '#5CE57D' },
      { mono: 'W2', name: 'Worker · UI', doing: 'Payment form and errors', state: 'Coding', tint: '#5CE57D' },
      { mono: 'R', name: 'Reviewer', doing: 'Starts when workers report', state: 'Waiting', tint: '#9AB1A0' }
    ];
    return { steps, agents: agents.map((a, i) => ({ ...a, border: i ? '1px solid #1F3326' : '0' })) };
  }
}
</script>
</body>
</html>
