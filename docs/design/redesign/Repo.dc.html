<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spriite · Where builds go</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5CE57D}a:hover{color:#8BF0A2}
input::placeholder{color:#7F9785}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #07110A; color: #EAF5EC; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, sans-serif; display: flex; flex-direction: column; padding: 18px 22px 26px; gap: 18px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Paired.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EAF5EC; margin-left: -10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; gap: 6px">
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #5CE57D"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #5CE57D"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #5CE57D"></div>
    </div>
    <span style="font-size: 13px; color: #9AB1A0; padding-left: 8px">3 of 3</span>
  </div>

  <sc-if value="{{keyOnly}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="fkey" style="font-size: 15px; font-weight: 600">Factory API key</label>
      <div style="display: flex; gap: 8px">
        <input id="fkey" type="password" placeholder="fk-…" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #24452F; background: #0D1A11; color: #EAF5EC; font: 16px 'JetBrains Mono', Menlo, monospace">
        <button type="button" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 0; background: #13241A; color: #EAF5EC; font: 600 14px 'Instrument Sans', sans-serif">Paste</button>
      </div>
      <a href="#" style="font-size: 13px; font-weight: 600">Get a key at app.factory.ai › Settings › API keys</a>
    </div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em">Where should builds go?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #9AB1A0">You can change this per build, by voice or on the phone.</p>
  </div>

  <div role="radiogroup" aria-label="Repository choice" style="display: flex; flex-direction: column; gap: 8px">
    <button type="button" role="radio" aria-checked="true" style="border-radius: 14px; border: 1.5px solid #5CE57D; background: #0F2215; color: #EAF5EC; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; text-align: left; font-family: inherit">
      <span style="width: 20px; height: 20px; flex: 0 0 20px; border-radius: 10px; border: 2px solid #5CE57D; box-sizing: border-box; display: flex; align-items: center; justify-content: center; margin-top: 1px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #5CE57D"></span></span>
      <span style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 15px; font-weight: 600">A new private repo for each idea</span>
        <span style="font-size: 13px; color: #9AB1A0; line-height: 1.4">Spriite names it from what you say. Nothing lands in an existing repo by accident.</span>
      </span>
    </button>
    <button type="button" role="radio" aria-checked="false" style="border-radius: 14px; border: 1px solid #1F3326; background: #0D1A11; color: #EAF5EC; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; text-align: left; font-family: inherit">
      <span style="width: 20px; height: 20px; flex: 0 0 20px; border-radius: 10px; border: 2px solid #5A7562; box-sizing: border-box; margin-top: 1px"></span>
      <span style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 15px; font-weight: 600">One repo I choose</span>
        <span style="font-size: 13px; color: #9AB1A0; line-height: 1.4">Pick from the list or paste any GitHub link.</span>
      </span>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="repoSearch" style="font-size: 13px; font-weight: 600; color: #9AB1A0">Or start from a repo</label>
    <div style="position: relative">
      <input id="repoSearch" placeholder="Search, or paste github.com/…" style="width: 100%; min-height: 48px; box-sizing: border-box; padding: 0 14px 0 42px; border-radius: 12px; border: 1px solid #24452F; background: #0D1A11; color: #EAF5EC; font: 16px 'Instrument Sans', sans-serif">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AB1A0" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    </div>
    <div style="background: #0D1A11; border: 1px solid #1F3326; border-radius: 14px; display: flex; flex-direction: column">
      <sc-for list="{{repos}}" as="r" hint-placeholder-count="4">
        <button type="button" style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: transparent; border: 0; border-top: {{r.border}}; color: #EAF5EC; font: 15px 'Instrument Sans', sans-serif; text-align: left">
          <span style="display: flex; flex-direction: column; gap: 1px">
            <span style="font-weight: 500">{{r.name}}</span>
            <span style="font-size: 12px; color: #9AB1A0">{{r.meta}}</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AB1A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
    <a href="Ready.dc.html" style="min-height: 52px; border-radius: 14px; background: #5CE57D; color: #04210E; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Finish setup</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"path":{"editor":"enum","default":"paired","options":["paired","key-only"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const repos = [
      { name: 'your-org/shop-site', meta: 'Private · updated today' },
      { name: 'your-org/api', meta: 'Private · updated this week' },
      { name: 'your-org/docs', meta: 'Public · updated last month' }
    ];
    return {
      keyOnly: (this.props.path ?? 'paired') === 'key-only',
      repos: repos.map((r, i) => ({ ...r, border: i ? '1px solid #1F3326' : '0' }))
    };
  }
}
</script>
</body>
</html>
