<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spriite · Review what came over</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5CE57D}a:hover{color:#8BF0A2}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #07110A; color: #EAF5EC; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, sans-serif; display: flex; flex-direction: column; padding: 18px 22px 26px; gap: 18px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Pair.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EAF5EC; margin-left: -10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; gap: 6px">
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #5CE57D"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #5CE57D"></div>
      <div style="flex: 1; height: 4px; border-radius: 2px; background: #1F3326"></div>
    </div>
    <span style="font-size: 13px; color: #9AB1A0; padding-left: 8px">2 of 3</span>
  </div>

  <div style="display: flex; gap: 14px; align-items: center">
    <div style="width: 72px; height: 72px; flex: 0 0 72px; border-radius: 36px; background: #0D1A11; border: 1px solid #1F3326; display: flex; align-items: center; justify-content: center">
      <dc-import name="Sprite" pose="celebrate" px="2" hint-size="64px,64px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: -0.02em">Paired with “studio”</h1>
      <span style="font-size: 14px; color: #9AB1A0">Here is what came over. Nothing to type.</span>
    </div>
  </div>

  <div style="background: #0D1A11; border: 1px solid #1F3326; border-radius: 18px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: {{r.border}}">
        <div style="width: 36px; height: 36px; flex: 0 0 36px; border-radius: 10px; background: #13241A; color: {{r.tint}}; display: flex; align-items: center; justify-content: center; font: 700 13px 'Instrument Sans', sans-serif">{{r.mono}}</div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
          <span style="font-size: 13px; color: #9AB1A0; line-height: 1.35">{{r.detail}}</span>
        </div>
        <sc-if value="{{r.ok}}" hint-placeholder-val="{{ true }}">
          <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: #5CE57D">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
            Found
          </span>
        </sc-if>
        <sc-if value="{{r.later}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 13px; font-weight: 600; color: #9AB1A0">Later</span>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 600">Where should builds run?</span>
    <div role="radiogroup" aria-label="Where builds run" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" role="radio" aria-checked="true" style="min-height: 64px; border-radius: 12px; border: 1.5px solid #5CE57D; background: #0F2215; color: #EAF5EC; font: 600 14px 'Instrument Sans', sans-serif; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 10px 12px; text-align: left">
        <span>On “studio”</span>
        <span style="font-size: 12px; font-weight: 500; color: #9AB1A0">Your machine, your tools</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="min-height: 64px; border-radius: 12px; border: 1px solid #1F3326; background: #0D1A11; color: #EAF5EC; font: 600 14px 'Instrument Sans', sans-serif; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 10px 12px; text-align: left">
        <span>Factory cloud</span>
        <span style="font-size: 12px; font-weight: 500; color: #9AB1A0">Runs while studio is off</span>
      </button>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
    <a href="Repo.dc.html" style="min-height: 52px; border-radius: 14px; background: #5CE57D; color: #04210E; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Looks right</a>
    <span style="font-size: 12px; color: #9AB1A0; text-align: center; line-height: 1.4">Keys are stored encrypted on this phone. Change any of them in Settings.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { mono: 'F', tint: '#7DBEFF', name: 'Factory account', detail: 'Signed in on studio', ok: true },
      { mono: 'D', tint: '#7DBEFF', name: 'Droid computer', detail: 'studio · online', ok: true },
      { mono: 'S', tint: '#5CE57D', name: 'Spriite host', detail: 'Private link over Tailscale', ok: true },
      { mono: 'G', tint: '#EAF5EC', name: 'GitHub', detail: 'From the GitHub CLI · [N] repos', ok: true },
      { mono: 'V', tint: '#F2B740', name: 'Voice replies', detail: 'No ElevenLabs key found', later: true },
      { mono: 'X', tint: '#EAF5EC', name: 'X requests', detail: 'Connect from your computer later', later: true }
    ];
    return { rows: rows.map((r, i) => ({ ...r, ok: !!r.ok, later: !!r.later, border: i ? '1px solid #1F3326' : '0' })) };
  }
}
</script>
</body>
</html>
