<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spriite · Ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5CE57D}a:hover{color:#8BF0A2}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #07110A; color: #EAF5EC; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, sans-serif; display: flex; flex-direction: column; padding: 34px 22px 26px; gap: 22px">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
    <div style="width: 176px; height: 176px; border-radius: 88px; background: #0D1A11; border: 1px solid #1F3326; display: flex; align-items: center; justify-content: center">
      <dc-import name="Sprite" pose="celebrate" px="4" hint-size="128px,128px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 700; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em">Spriite is ready.</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #9AB1A0">On the glasses, hold the touchpad and say what to build. Or type it here.</p>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9AB1A0">Optional extras</span>
    <div style="background: #0D1A11; border: 1px solid #1F3326; border-radius: 16px; display: flex; flex-direction: column">
      <sc-for list="{{extras}}" as="e" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: {{e.border}}">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600">{{e.name}}</span>
            <span style="font-size: 13px; color: #9AB1A0; line-height: 1.35">{{e.detail}}</span>
          </div>
          <button type="button" style="min-height: 40px; min-width: 76px; padding: 0 14px; border-radius: 10px; border: 1px solid #24452F; background: transparent; color: #EAF5EC; font: 600 14px 'Instrument Sans', sans-serif">{{e.cta}}</button>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
    <a href="Home.dc.html" style="min-height: 52px; border-radius: 14px; background: #5CE57D; color: #04210E; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Open Spriite</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const extras = [
      { name: 'Spoken replies', detail: 'Spriite reads updates aloud with ElevenLabs.', cta: 'Add key' },
      { name: 'Build from X posts', detail: 'Tag your Spriite account. Sign-in opens on studio.', cta: 'Connect' },
      { name: 'Cursor workers', detail: 'Hand big tasks to Cursor agents too.', cta: 'Add key' }
    ];
    return { extras: extras.map((e, i) => ({ ...e, border: i ? '1px solid #1F3326' : '0' })) };
  }
}
</script>
</body>
</html>
